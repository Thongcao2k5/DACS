<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - MotoShop</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- UI UTILITIES Placeholder -->
    <div id="pageLoader" style="display: none !important;"><div class="loader-spinner"></div></div>
    <div id="backToTop" class="back-to-top"><i class='bx bx-chevron-up'></i></div>

    <!-- COMMON COMPONENTS PLACEHOLDERS -->
    <div id="mainHeaderWrapper" class="main-header-wrapper"></div>
    <div id="searchOverlay" class="search-overlay"></div>
    <div id="mobileMenu" class="offcanvas offcanvas-start mobile-menu-offcanvas" tabindex="-1"></div>

    <!-- 1. BREADCRUMB -->
    <div class="breadcrumb-wrapper">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Đăng ký tài khoản</li>
                </ol>
            </nav>
        </div>
    </div>

    <main class="auth-wrapper">
        <div class="container">
            <!-- 2. REGISTER CONTAINER -->
            <div class="auth-card">
                <div class="auth-header">
                    <h2>ĐĂNG KÝ TÀI KHOẢN</h2>
                    <p>Trở thành thành viên MotoShop để nhận ngay các ưu đãi đặc biệt.</p>
                </div>

                <!-- 3. REGISTER FORM -->
                <form id="registerForm" onsubmit="handleRegisterStep1(event)">
                    <div class="mb-3">
                        <label class="form-label-custom">Họ và tên *</label>
                        <input type="text" id="regFullName" class="form-control form-control-custom" placeholder="Nhập họ và tên của bạn" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-12">
                            <label class="form-label-custom">Email *</label>
                            <input type="email" id="regEmail" class="form-control form-control-custom" placeholder="email@vi dụ.com" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label-custom">Mật khẩu *</label>
                        <div class="password-group">
                            <input type="password" id="regPassword" class="form-control form-control-custom" placeholder="Tối thiểu 6 ký tự" required>
                            <i class='bx bx-hide password-toggle-icon' onclick="togglePass('regPassword', this)"></i>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label-custom">Xác nhận mật khẩu *</label>
                        <div class="password-group">
                            <input type="password" id="regConfirmPassword" class="form-control form-control-custom" placeholder="Nhập lại mật khẩu" required>
                            <i class='bx bx-hide password-toggle-icon' onclick="togglePass('regConfirmPassword', this)"></i>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="termsCheck" required>
                            <label class="form-check-label text-muted small" for="termsCheck">
                                Tôi đồng ý với <a href="terms.html" class="text-danger">Điều khoản sử dụng</a> và Chính sách bảo mật của MotoShop.
                            </label>
                        </div>
                    </div>

                    <div id="registerError" class="alert alert-danger d-none py-2 small mb-3">
                        <i class='bx bx-error-circle me-1'></i> <span></span>
                    </div>

                    <button type="submit" id="btnRegister" class="btn btn-danger btn-lg w-100 rounded-pill fw-bold mb-4">TIẾP TỤC</button>
                </form>

                <!-- 3.1 OTP VERIFICATION FORM (HIDDEN BY DEFAULT) -->
                <form id="otpForm" class="d-none" onsubmit="handleVerifyOtp(event)">
                    <div class="text-center mb-4">
                        <div class="otp-icon-wrapper mb-3">
                            <i class='bx bx-envelope-open fs-1 text-danger'></i>
                        </div>
                        <h4 class="fw-bold">Xác thực Email</h4>
                        <p class="text-muted small">Chúng tôi đã gửi mã xác nhận đến <br><b id="displayEmail"></b></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label-custom text-center d-block">Nhập mã xác nhận (6 chữ số)</label>
                        <input type="text" id="otpCode" class="form-control form-control-custom text-center fs-4 fw-bold letter-spacing-5" 
                               placeholder="000000" maxlength="6" pattern="\d{6}" required>
                    </div>

                    <div id="otpError" class="alert alert-danger d-none py-2 small mb-3">
                        <i class='bx bx-error-circle me-1'></i> <span>Mã không chính xác.</span>
                    </div>

                    <button type="submit" id="btnVerify" class="btn btn-danger btn-lg w-100 rounded-pill fw-bold mb-3">XÁC NHẬN ĐĂNG KÝ</button>
                    
                    <div class="text-center">
                        <button type="button" class="btn btn-link btn-sm text-muted text-decoration-none" onclick="backToRegister()">
                            <i class='bx bx-left-arrow-alt'></i> Quay lại chỉnh sửa thông tin
                        </button>
                    </div>
                </form>

                <!-- 4. ADDITIONAL OPTIONS -->
                <div class="text-center">
                    <p class="text-muted small mb-0">Đã có tài khoản? <a href="login.html" class="text-danger fw-bold text-decoration-none">Đăng nhập</a></p>
                </div>

                <div class="social-auth-divider">
                    <span>Hoặc đăng ký nhanh bằng</span>
                </div>

                <div class="social-btns">
                    <a href="#" class="btn-social btn-google">
                        <i class='bx bxl-google'></i> Google
                    </a>
                    <a href="#" class="btn-social btn-facebook">
                        <i class='bx bxl-facebook-circle'></i> Facebook
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-5 mt-5"></footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api-handler.js"></script>
    <script src="js/header.js"></script>
    <script src="js/components.js"></script>
    <script>
        // API CONFIG (Nếu chưa có trong api-handler.js)
        const BASE_API_URL = window.location.protocol === 'https:' ? 'https://localhost:7106' : 'http://localhost:5201';

        // Hàm ẩn hiện mật khẩu dùng chung
        function togglePass(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bx-hide', 'bx-show');
            } else {
                input.type = 'password';
                icon.classList.replace('bx-show', 'bx-hide');
            }
        }

        function backToRegister() {
            document.getElementById('otpForm').classList.add('d-none');
            document.getElementById('registerForm').classList.remove('d-none');
            document.querySelector('.auth-header p').textContent = 'Trở thành thành viên MotoShop để nhận ngay các ưu đãi đặc biệt.';
        }

        async function handleRegisterStep1(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('regFullName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const errorDiv = document.getElementById('registerError');
            const btn = document.getElementById('btnRegister');

            // Reset error
            errorDiv.classList.add('d-none');

            // Validate local
            if (password !== confirmPassword) {
                errorDiv.querySelector('span').textContent = 'Mật khẩu xác nhận không khớp.';
                errorDiv.classList.remove('d-none');
                return;
            }

            if (password.length < 6) {
                errorDiv.querySelector('span').textContent = 'Mật khẩu phải có ít nhất 6 ký tự.';
                errorDiv.classList.remove('d-none');
                return;
            }

            // Show loading
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> ĐANG XỬ LÝ...';

            try {
                const response = await fetch(`${BASE_API_URL}/api/AccountApi/register-step1`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    // Thành công: Chuyển sang form OTP
                    document.getElementById('registerForm').classList.add('d-none');
                    document.getElementById('otpForm').classList.remove('d-none');
                    document.getElementById('displayEmail').textContent = email;
                    document.querySelector('.auth-header p').textContent = 'Vui lòng nhập mã xác nhận đã được gửi vào email của bạn.';
                } else {
                    // Lỗi từ server
                    errorDiv.querySelector('span').textContent = result.message || 'Có lỗi xảy ra.';
                    errorDiv.classList.remove('d-none');
                }
            } catch (error) {
                errorDiv.querySelector('span').textContent = 'Không thể kết nối đến máy chủ. Vui lòng thử lại sau.';
                errorDiv.classList.remove('d-none');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'TIẾP TỤC';
            }
        }

        async function handleVerifyOtp(e) {
            e.preventDefault();

            const email = document.getElementById('regEmail').value;
            const code = document.getElementById('otpCode').value;
            const errorDiv = document.getElementById('otpError');
            const btn = document.getElementById('btnVerify');

            errorDiv.classList.add('d-none');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> ĐANG XÁC THỰC...';

            try {
                const response = await fetch(`${BASE_API_URL}/api/AccountApi/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Đăng ký thành công! Chào mừng bạn đến với MotoShop.');
                    window.location.href = 'login.html';
                } else {
                    errorDiv.querySelector('span').textContent = result.message || 'Mã xác nhận không đúng.';
                    errorDiv.classList.remove('d-none');
                }
            } catch (error) {
                errorDiv.querySelector('span').textContent = 'Có lỗi xảy ra. Vui lòng thử lại.';
                errorDiv.classList.remove('d-none');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'XÁC NHẬN ĐĂNG KÝ';
            }
        }
    </script>
</body>
</html>
